beskrivelse: "Database over norske selskaper, eierskap, roller og politikere."
samlinger:
  - navn: "selskap"
    beskrivelse: "Inneholder stamdata om alle registrerte selskaper."
    felt:
      orgnr: "Organisasjonsnummer (Unik ID for selskapet)"
      uuid: "Intern unik ID"
      navn: "Selskapets navn"
      organisasjonstype: "Type selskap (f.eks. AS, ASA, ENK)"
      nacekode: "Bransjekode"
      etablertdato: "Dato for stiftelse"
      oppløstdato: "Dato for nedleggelse (hvis aktuelt)"
      konkursflagg: "Boolean: om selskapet er konkurs"
      likvidasjonflagg: "Boolean: om selskapet er under avvikling"

  - navn: "person"
    beskrivelse: "Informasjon om enkeltpersoner og deres roller i næringslivet."
    felt:
      uuid: "Unik ID for personen (Bruk denne i stedet for _id)"
      navn: "Fullt navn"
      fødselsdato: "Fødselsdato"
      fødselsår: "Fødselsår"
      kjønnuuid: "ID for kjønn"
      adresse: "Objekt med adresse, postnummer, poststed, land og landkode"
      kommune: "Objekt med kommunenummer og kommunenavn"
      rolle: "Liste over roller. Hvert element inneholder orgnr, selskap_navn, rolle_type, startdato og sluttdato"

  - navn: "eierskap"
    beskrivelse: "Detaljer om hvem som eier aksjer i hvilke selskaper per år."
    felt:
      ownership_uuid: "Unik ID for eierskapsforholdet"
      year: "Året eierskapet gjelder for"
      owner: "Objekt med eierinfo (uuid, navn, adresse, kommune, etc.)"
      company: "Objekt med selskapinfo (orgnr, uuid, navn)"
      andel: "Eierandel i prosent"
      antall: "Antall aksjer eid"
      stemmeandel: "Stemmeandel i prosent"
      totalantall: "Totalt antall aksjer i selskapet"
      stemmeantall: "Antall stemmer eieren har"
      totalsstemmeantall: "Totalt antall stemmer i selskapet"

  - navn: "aksjeeiebok"
    beskrivelse: "Offisiell aksjeeierbok med oversikt over aksjeklasser og aksjonærer."
    felt:
      orgnr: "Selskapets organisasjonsnummer"
      selskap: "Selskapets navn"
      år: "Gjeldende år"
      aksjeklasse: "Type aksje (f.eks. A-aksjer, B-aksjer)"
      aksjonær: "Objekt med navn, nummer, poststed og landkode"
      antallaksjer: "Antall aksjer hos denne aksjonæren"
      antallaksjerselskap: "Totalt antall aksjer i dette selskapet"

  - navn: "politikere"
    beskrivelse: "Oversikt over politikere, partitilhørighet og valgresultater."
    felt:
      navn: "Politikerens navn"
      parti: "Politisk parti"
      kommunenr: "Kommunenummer"
      kommune: "Kommunenavn"
      foedselsdato: "Fødselsdato"
      listeplass: "Plassering på valglisten"
      stemmetillegg: "Antall stemmetillegg"
      personstemmer: "Antall personstemmer mottatt"
      slengere: "Antall slengere"
      endeligrangering: "Rangering etter valgoppgjør"
      innvalgt: "Boolean: om personen ble valgt inn"

relasjoner:
  - "person.roles.orgnr kobles mot selskap.orgnr"
  - "eierskap.owner.uuid kobles mot person.uuid"
  - "eierskap.company.orgnr kobles mot selskap.orgnr"
  - "aksjeeiebok.orgnr kobles mot selskap.orgnr"
  - "person.navn kan kobles mot politikere.navn for å finne politikere i næringslivet"