beskrivelse: >
  Database over norske selskaper, eierskap, roller og politikere.
  Dataene er hentet fra offentlige registre og inneholder informasjon om
  registrerte selskaper, hvem som eier dem, hvilke roller personer har i
  næringslivet, og oversikt over politikere.

samlinger:

  - navn: "selskap"
    beskrivelse: >
      Inneholder informasjon om alle registrerte norske selskaper.
      Her finner du grunnleggende opplysninger som navn, organisasjonsnummer,
      organisasjonstype, og om selskapet er konkurs eller under avvikling.
    felt:
      uuid:               "Unik identifikator for selskapet i denne databasen"
      navn:               "Navnet på selskapet"
      orgNr:              "Organisasjonsnummer — det offisielle nummeret fra Brønnøysundregistrene"
      organisasjonstype:  "Selskapsform, for eksempel AS (aksjeselskap), ASA, eller ENK (enkeltpersonforetak)"
      etablertDato:       "Datoen selskapet ble stiftet"
      oppløstDato:        "Datoen selskapet ble lagt ned (tomt hvis selskapet fortsatt er aktivt)"
      konkursFlagg:       "1 hvis selskapet er konkurs, 0 hvis ikke"
      likvidasjonFlagg:   "1 hvis selskapet er under avvikling (likvidasjon), 0 hvis ikke"
      naceKode:           "Bransjekode som beskriver hva slags virksomhet selskapet driver"

  - navn: "personer"
    beskrivelse: >
      Inneholder informasjon om enkeltpersoner og hvilke roller de har i
      næringslivet. Én person kan ha roller i flere selskaper, og vil da
      dukke opp som én rad per rolle. Feltet selskapRolle beskriver hvilken
      stilling eller funksjon personen har i det aktuelle selskapet.
    felt:
      UUID:               "Unik identifikator for personen i denne databasen"
      navn:               "Fullt navn"
      fødselsdato:        "Fødselsdato"
      fødselsår:          "Fødselsår"
      kjønnUUID:          "Identifikator for kjønn"
      adresse:            "Gateadresse"
      postnummer:         "Postnummer"
      poststed:           "Poststed"
      kommuneNr:          "Kommunenummer"
      kommuneNavn:        "Kommunenavn"
      land:               "Landnavn"
      landkode:           "To-bokstavers landkode (f.eks. NO for Norge)"
      registrertTid:      "Tidspunkt da personen ble registrert i databasen"
      oppdatertTid:       "Tidspunkt for siste oppdatering av personens opplysninger"
      selskapNavn:        "Navn på selskapet personen har en rolle i"
      selskapUUID:        "Unik identifikator for det tilknyttede selskapet"
      selskapOrgNr:       "Organisasjonsnummer for det tilknyttede selskapet"
      selskapRegistrert:  "Tidspunkt da selskapet ble registrert"
      selskapOppdatert:   "Tidspunkt da selskapets opplysninger sist ble oppdatert"
      selskapRolle:       "Personens rolle i selskapet (f.eks. Styreleder, Daglig leder, Styremedlem)"
      selskapRolleUUID:   "Unik identifikator for selskapsrollen"
      selskapRolleRang:   "Rangering av rollen — brukes til å sortere roller etter viktighet"
      rolleUUID:          "Unik identifikator for denne spesifikke rolletilknytningen"
      rolleStartdato:     "Dato da personen startet i rollen"
      rolleSluttdato:     "Dato da personen sluttet i rollen (tomt hvis rollen fortsatt er aktiv)"
      rolleRegistrert:    "Tidspunkt da rollen ble registrert i databasen"
      rolleOppdatert:     "Tidspunkt da rolleopplysningene sist ble oppdatert"

  - navn: "eierskap"
    beskrivelse: >
      Viser hvem som eier aksjer i hvilke selskaper, og hvor stor eierandel
      de har. Dataene er organisert per år, slik at man kan følge endringer
      i eierskap over tid. Eieren kan være enten en person eller et selskap.
    felt:
      eierskapUUID:               "Unik identifikator for dette eierskapsforholdet"
      eierskapår:                 "Året disse eierskapsopplysningene gjelder for"
      eierskapAndel:              "Eierandel i prosent (f.eks. 50.0 betyr 50%)"
      eierskapAntall:             "Antall aksjer denne eieren har i selskapet"
      eierskapAksjonær:           "Navn på aksjonæren slik det er registrert"
      eierskapStemmeandel:        "Stemmeandel i prosent"
      eierskapStemmeantall:       "Antall stemmeaksjer denne eieren har"
      eierskapTotalAntall:        "Totalt antall aksjer som finnes i selskapet"
      eierskapTotalStemmeantall:  "Totalt antall stemmeaksjer som finnes i selskapet"
      eierPersonUUID:             "Unik identifikator for eierpersonen (tomt hvis eieren er et selskap)"
      eierPersonNavn:             "Fullt navn på eierpersonen"
      eierPersonFødselsdato:      "Fødselsdato for eierpersonen"
      eierPersonFødselsår:        "Fødselsår for eierpersonen"
      eierPersonKjønnUUID:        "Identifikator for eierpersonens kjønn"
      eierPersonAdresse:          "Adresse for eierpersonen"
      eierPersonPostkode:         "Postkode for eierpersonen"
      eierPersonPoststed:         "Poststed for eierpersonen"
      eierPersonKommuneNr:        "Kommunenummer for eierpersonen"
      eierPersonKommune:          "Kommunenavn for eierpersonen"
      eierSelskapNavn:            "Navn på eierselskapet (tomt hvis eieren er en person)"
      eierSelskapUUID:            "Unik identifikator for eierselskapet"
      eierSelskapOrgNr:           "Organisasjonsnummer for eierselskapet"
      utstederNavn:               "Navn på selskapet som aksjene tilhører"
      utstederUUID:               "Unik identifikator for selskapet som utsteder aksjene"
      utstederOrgNr:              "Organisasjonsnummer for selskapet som utsteder aksjene"

  - navn: "aksjeeiebok"
    beskrivelse: >
      Den offisielle aksjeeierboken viser hvem som eier aksjer i et selskap
      per år, fordelt på aksjeklasse. En aksjeklasse beskriver typen aksje,
      for eksempel A-aksjer og B-aksjer som kan ha ulike rettigheter.
    felt:
      orgNr:              "Organisasjonsnummer for selskapet aksjene tilhører"
      selskap:            "Navn på selskapet"
      år:                 "Året disse opplysningene gjelder for"
      aksjeklasse:        "Type aksje (f.eks. A-aksjer eller B-aksjer)"
      aksjonærNavn:       "Navn på aksjonæren"
      fødselsår:          "Fødselsår for personen, eller organisasjonsnummer hvis aksjonæren er et selskap"
      postnr_sted:        "Postnummer og poststed for aksjonæren"
      landkode:           "Landkode for aksjonæren"
      antallAksjer:       "Antall aksjer denne aksjonæren eier i selskapet"
      antallAksjerSelskap: "Totalt antall aksjer i selskapet på tvers av alle aksjonærer"

  - navn: "politikere"
    beskrivelse: >
      Oversikt over politikere med informasjon om parti, kommune og
      valgresultater. Inneholder data om listeplassering, antall
      personstemmer, og om politikeren ble valgt inn.
    felt:
      navn:             "Politikerens fulle navn"
      partinavn:        "Partiet politikeren representerer"
      kommunenummer:       "Kommunenummer"
      kommune:          "Kommunen politikeren stiller til valg i"
      fødselsdato:      "Fødselsdato"
      listeplass:       "Plassering på partiets valgliste"
      personstemmer:    "Antall personstemmer politikeren mottok"
      stemmetillegg:    "Antall stemmer lagt til fra sentralt hold"
      slengere:         "Antall velgere fra andre partier som stemte på denne personen"
      endelig_rangering: "Endelig rangering etter at alle stemmer er talt opp"
      innvalgt:         "'Ja' eller 'nei' — om politikeren ble valgt inn"