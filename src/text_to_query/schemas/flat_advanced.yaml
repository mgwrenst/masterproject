beskrivelse: >
  Teknisk schema for den flate MongoDB-databasen groundtruth. Databasen
  består av separate samlinger som ligner relasjonelle tabeller. Relasjoner
  kobles vanligvis med organisasjonsnummer, navn, fødselsdato eller UUID.

samlinger:

  - navn: "selskap"
    beskrivelse: "Ett dokument per selskap."
    felt:
      uuid:
        type: "string|null"
      navn:
        type: "string"
      orgNr:
        type: "integer|string"
      organisasjonstype:
        type: "string|null"
      konkursFlagg:
        type: "integer"
        verdier: [0, 1]
      likvidasjonFlagg:
        type: "integer"
        verdier: [0, 1]
      naceKode:
        type: "number|string|null"
      naceBeskrivelse:
        type: "string|null"
      etablertDato:
        type: "string|date|null"
      oppløstDato:
        type: "string|date|null"

  - navn: "personer"
    beskrivelse: >
      Rolleoppføringer for personer i selskaper. En person kan forekomme
      flere ganger dersom personen har flere roller.
    felt:
      uuid:
        type: "string|null"
      navn:
        type: "string"
      fødselsdato:
        type: "string|date|null"
      fødselsår:
        type: "integer|number|null"
      kjønn:
        type: "string|null"
      adresse:
        type: "string|null"
      kommuneNavn:
        type: "string|null"
      kommuneNr:
        type: "integer|number|string|null"
      postnummer:
        type: "integer|number|string|null"
      poststed:
        type: "string|null"
      land:
        type: "string|null"
      landkode:
        type: "string|null"
      selskapNavn:
        type: "string"
      selskapOrgNr:
        type: "integer|string"
      selskapUUID:
        type: "string|null"
      selskapRolle:
        type: "string"
      selskapRolleRang:
        type: "integer|number|null"
      rolleUUID:
        type: "string|null"
      selskapRolleUUID:
        type: "string|null"
      rolleStartdato:
        type: "string|date|null"
      rolleSluttdato:
        type: "string|date|null"
      rolleRegistrert:
        type: "string|date|null"
      rolleOppdatert:
        type: "string|date|null"
      selskapRegistrert:
        type: "string|date|null"
      selskapOppdatert:
        type: "string|date|null"
      registrertTid:
        type: "string|date|null"
      oppdatertTid:
        type: "string|date|null"

  - navn: "politikere"
    beskrivelse: "Politikeroppføringer og valgresultater."
    felt:
      navn:
        type: "string"
      fødselsdato:
        type: "string|date|null"
      partinavn:
        type: "string|null"
      kommune:
        type: "string|null"
      kommunenummer:
        type: "integer|number|null"
      listeplass:
        type: "integer|number|null"
      personstemmer:
        type: "integer|number|null"
      slengere:
        type: "integer|number|null"
      stemmetillegg:
        type: "string|number|null"
      endelig_rangering:
        type: "integer|number|null"
      innvalgt:
        type: "string|null"
        eksempelverdier: ["Ja", "Nei"]

  - navn: "eierskap"
    beskrivelse: "Eierskapsoppføringer for aksjer i selskaper."
    felt:
      eierskapUUID:
        type: "string|null"
      eierskapår:
        type: "integer"
      eierPersonNavn:
        type: "string|null"
      eierPersonFødselsdato:
        type: "string|date|null"
      eierPersonFødselsår:
        type: "integer|number|null"
      eierPersonKjønn:
        type: "string|null"
      eierPersonAdresse:
        type: "string|null"
      eierPersonKommune:
        type: "string|null"
      eierPersonKommuneNr:
        type: "integer|number|string|null"
      eierPersonPostkode:
        type: "integer|number|string|null"
      eierPersonPoststed:
        type: "string|null"
      eierPersonUUID:
        type: "string|null"
      eierSelskapNavn:
        type: "string|null"
      eierSelskapOrgNr:
        type: "integer|string|null"
      eierSelskapUUID:
        type: "string|null"
      utstederNavn:
        type: "string"
      utstederOrgNr:
        type: "integer|string"
      utstederUUID:
        type: "string|null"
      eierskapAksjonær:
        type: "string|null"
      eierskapAndel:
        type: "number|null"
      eierskapAntall:
        type: "integer|number|null"
      eierskapStemmeandel:
        type: "number|null"
      eierskapStemmeantall:
        type: "integer|number|null"
      eierskapTotalAntall:
        type: "integer|number|null"
      eierskapTotalStemmeantall:
        type: "integer|number|null"

  - navn: "aksjeeiebok"
    beskrivelse: "Aksjonærer i selskaper per år og aksjeklasse."
    felt:
      orgNr:
        type: "integer|string"
      selskap:
        type: "string"
      år:
        type: "integer"
      aksjeklasse:
        type: "string|null"
      aksjonærNavn:
        type: "string|null"
      fødselsår:
        type: "integer|number|null"
      landkode:
        type: "string|null"
      postnr/sted:
        type: "string|null"
      antallAksjer:
        type: "integer|number|null"
      antallAksjerSelskap:
        type: "integer|number|null"

regler:
  - "Koble selskaper til personer via selskap.orgNr = personer.selskapOrgNr."
  - "Koble selskaper til eierskap via selskap.orgNr = eierskap.utstederOrgNr."
  - "Koble selskaper til aksjeeierbok via selskap.orgNr = aksjeeiebok.orgNr."
  - "Koble politikere til personer/eierskap/aksjonærer med navn og eventuelt fødselsdato eller fødselsår når dette finnes."
  - "Teknisk bruker kjenner til indekser og bør foretrekke indekserte felter i filter og lookup når det passer spørsmålet."
  - "Indekser i selskap: orgNr, navn, konkursFlagg, likvidasjonFlagg, naceBeskrivelse."
  - "Indekser i personer: selskapOrgNr, navn, fødselsdato, selskapRolle."
  - "Indekser i politikere: navn, fødselsdato, partinavn, innvalgt."
  - "Indekser i eierskap: utstederOrgNr, eierPersonNavn, eierPersonFødselsdato, eierskapår."
  - "Indekser i aksjeeiebok: orgNr, år, aksjonærNavn, aksjeklasse."
