beskrivelse: >
  Dette er en database med informasjon om norske selskaper, personer, roller i
  selskaper, eierskap, aksjeeierbok og politikere. Databasen kan brukes til å
  undersøke forbindelser mellom personer, selskaper og politiske tilknytninger.
  Noen samlinger har informasjon samlet i ett dokument per selskap eller person,
  mens andre samlinger viser enkeltoppføringer. Noen felt ligger under et
  overordnet feltnavn, for eksempel status.konkursFlagg eller datoer.etablertDato.

samlinger:

  - navn: "selskap"
    beskrivelse: >
      Selskap inneholder ett dokument per selskap. Her finnes blant annet navn,
      uuid, orgNr (organisasjonsnummer), organisasjonstype, status.konkursFlagg
      (1 for konkurs, 0 for ikke konkurs), status.likvidasjonFlagg (1 for
      likvidasjon, 0 for ikke likvidasjon), bransje.naceKode,
      bransje.naceBeskrivelse, datoer.etablertDato og datoer.oppløstDato.
      Samlingen har også relasjoner.antallRoller, relasjoner.antallEierskap og
      relasjoner.antallAksjeeierbok, som kan brukes når spørsmål ber om antall
      kjente roller, eierskap eller aksjeeierbokoppføringer knyttet til
      selskapet. Dokumentet kan også ha listene roller, eierskap og
      aksjeeiebok med opplysninger som er knyttet til selskapet. Disse listene
      kan brukes når spørsmålet handler om informasjon som ligger direkte på
      selskapsdokumentet. Listen roller kan blant annet inneholde rolle,
      startdato og personopplysninger som person.navn, person.fødselsdato og
      person.politiker.partinavn. Listen eierskap kan blant annet inneholde år,
      eier.navn, eier.orgNr, aksjer.andel, aksjer.antall og stemmer.antall.
      Listen aksjeeiebok kan blant annet inneholde år, aksjeklasse,
      aksjonær.navn, aksjonær.fødselsår, aksjonær.landkode og aksjer.antall.
      Samlingen kan brukes når spørsmål handler om selskaper, konkurser,
      organisasjonstyper, bransjer eller datoer for selskaper.

  - navn: "personer"
    beskrivelse: >
      Personer inneholder ett dokument per identifisert person. Her finnes blant
      annet uuid, navn, fødselsdato, fødselsår og kjønn. Dersom personen også
      er politiker, finnes politikerinformasjon i feltet politiker, blant annet
      politiker.erPolitiker, politiker.partinavn, politiker.kommune,
      politiker.kommunenummer, politiker.innvalgt, politiker.valg.listeplass,
      politiker.valg.personstemmer og politiker.valg.slengere.
      Samlingen har også relasjoner.antallRoller, relasjoner.antallEierskap og
      relasjoner.antallAksjeeierbok, som kan brukes når spørsmål handler om en
      persons samlede antall roller eller eierskap. Dokumentet kan også ha
      listene roller, eierskap og aksjeeiebok med opplysninger som er knyttet
      til personen. Disse listene kan brukes når spørsmålet handler om
      informasjon som ligger direkte på persondokumentet. Listen roller kan
      blant annet inneholde rolle og selskapsopplysninger som selskap.navn og
      selskap.orgNr. Listen eierskap kan blant annet inneholde år, selskap.navn,
      selskap.orgNr, aksjer.andel og aksjer.antall. Listen aksjeeiebok kan
      blant annet inneholde år, aksjeklasse, selskap.navn, selskap.orgNr og
      aksjer.antall. Samlingen kan brukes når spørsmål handler om personer,
      politikerstatus eller samlet informasjon om en person.

  - navn: "roller"
    beskrivelse: >
      Roller inneholder informasjon om personer og hvilke roller de har hatt i
      selskaper. Hver oppføring beskriver én rolle i ett selskap. Her finnes
      blant annet feltene navn, fødselsdato, fødselsår, kjønn, selskapNavn,
      selskapOrgNr, selskapUUID, selskapRolle, selskapRolleRang, rolleUUID,
      rolleStartdato, rolleRegistrert, rolleOppdatert, selskapRegistrert,
      selskapOppdatert, registrertTid og oppdatertTid. Samlingen kan brukes når
      spørsmål handler om enkeltroller, rolletype, personer med roller eller
      hvilke selskaper personer har roller i.

  - navn: "politikere"
    beskrivelse: >
      Politikere inneholder informasjon om politikere, politisk parti, kommune
      og valgresultater. Her finnes blant annet feltene navn, fødselsdato,
      partinavn, kommune, kommunenummer, listeplass, personstemmer, slengere,
      stemmetillegg, endelig_rangering og innvalgt ("Ja" eller "Nei").
      Samlingen kan brukes når spørsmål handler om politikere, partier,
      kommuner, valgresultater, listeplasseringer eller hvem som ble innvalgt.

  - navn: "eierskap"
    beskrivelse: >
      Eierskap inneholder informasjon om hvem som eier aksjer i selskaper.
      Eieren kan være enten en person eller et selskap. Dersom eieren er en
      person, finnes informasjon i feltene eierPersonNavn,
      eierPersonFødselsdato, eierPersonFødselsår, eierPersonKjønn,
      eierPersonAdresse, eierPersonKommune, eierPersonKommuneNr,
      eierPersonPostkode, eierPersonPoststed og eierPersonUUID. Dersom eieren
      er et selskap, finnes informasjon i feltene eierSelskapNavn,
      eierSelskapOrgNr og eierSelskapUUID. Selskapet det eies aksjer i
      beskrives med feltene utstederNavn, utstederOrgNr og utstederUUID.
      Selve eierskapet beskrives med feltene eierskapAksjonær, eierskapAndel,
      eierskapAntall, eierskapStemmeandel, eierskapStemmeantall,
      eierskapTotalAntall, eierskapTotalStemmeantall, eierskapUUID og
      eierskapår. Samlingen kan brukes når spørsmål handler om eiere,
      eierandeler, antall aksjer, stemmerettigheter eller eierskap per år.

  - navn: "aksjeeiebok"
    beskrivelse: >
      Aksjeeiebok viser aksjonærer i selskaper per år og aksjeklasse. Her finnes
      blant annet feltene orgNr, selskap, år, aksjeklasse, aksjonærNavn,
      fødselsår, landkode, postnr/sted, antallAksjer og antallAksjerSelskap.
      Aksjonærnavn er skrevet som vanlige navn, for eksempel Ola Nordmann.
      Samlingen kan brukes når spørsmål handler om aksjonærer, aksjeklasser,
      aksjer per selskap, aksjonærer fra bestemte land eller aksjonærer født i
      bestemte år.
