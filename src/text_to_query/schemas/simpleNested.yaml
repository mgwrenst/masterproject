beskrivelse: >
  Database over norske selskaper, eierskap, roller og politikere.
  Denne versjonen bruker nestede felt for å gruppere relatert informasjon.
  For å spørre på nestede felt brukes punktnotasjon, f.eks. "status.konkurs" eller "rolle.tittel".

samlinger:

  - navn: "selskap"
    beskrivelse: >
      Inneholder informasjon om alle registrerte norske selskaper.
      Statusfelter (konkurs, likvidasjon) er gruppert under "status".
      Datoer (etablert, oppløst) er gruppert under "datoer".
    felt:
      uuid:               "Unik identifikator for selskapet"
      navn:               "Navnet på selskapet"
      orgNr:              "Organisasjonsnummer"
      organisasjonstype:  "Selskapsform, for eksempel AS, ASA, eller ENK"
      naceKode:           "Bransjekode som beskriver virksomheten"
      datoer.etablert:    "Datoen selskapet ble stiftet"
      datoer.oppløst:     "Datoen selskapet ble lagt ned (tomt hvis fortsatt aktivt)"
      status.konkurs:     "1 hvis selskapet er konkurs, 0 hvis ikke"
      status.likvidasjon: "1 hvis selskapet er under avvikling, 0 hvis ikke"

  - navn: "personer"
    beskrivelse: >
      Inneholder informasjon om enkeltpersoner og deres roller i næringslivet.
      Én person kan ha roller i flere selskaper og vil dukke opp som én rad per rolle.
      Personopplysninger er gruppert under "personInfo", adresse under "adresse",
      selskapstilknytning under "selskap", og rolleinformasjon under "rolle".
    felt:
      UUID:                       "Unik identifikator for personen"
      personInfo.navn:            "Fullt navn"
      personInfo.fødselsdato:     "Fødselsdato"
      personInfo.fødselsår:       "Fødselsår"
      personInfo.kjønnUUID:       "Identifikator for kjønn"
      adresse.gateadresse:        "Gateadresse"
      adresse.postnummer:         "Postnummer"
      adresse.poststed:           "Poststed"
      adresse.kommuneNr:          "Kommunenummer"
      adresse.kommuneNavn:        "Kommunenavn"
      adresse.land:               "Landnavn"
      adresse.landkode:           "To-bokstavers landkode (f.eks. NO)"
      registrering.registrertTid: "Tidspunkt personen ble registrert"
      registrering.oppdatertTid:  "Tidspunkt for siste oppdatering"
      selskap.navn:               "Navn på selskapet personen har en rolle i"
      selskap.uuid:               "Unik identifikator for selskapet"
      selskap.orgNr:              "Organisasjonsnummer for selskapet"
      selskap.registrert:         "Tidspunkt selskapet ble registrert"
      selskap.oppdatert:          "Tidspunkt selskapet sist ble oppdatert"
      rolle.tittel:               "Personens rolle (f.eks. Styreleder, Daglig leder, Styremedlem)"
      rolle.uuid:                 "Unik identifikator for selskapsrollen"
      rolle.rolleUUID:            "Unik identifikator for denne spesifikke rolletilknytningen"
      rolle.rang:                 "Rangering av rollen"
      rolle.startdato:            "Dato personen startet i rollen"
      rolle.sluttdato:            "Dato personen sluttet i rollen (tomt hvis rollen er aktiv)"
      rolle.registrert:           "Tidspunkt rollen ble registrert"
      rolle.oppdatert:            "Tidspunkt rollen sist ble oppdatert"

  - navn: "eierskap"
    beskrivelse: >
      Viser hvem som eier aksjer i hvilke selskaper per år.
      Eierinformasjon er gruppert under "eier", med "eier.person" for personlige eiere
      og "eier.selskap" for selskapseiere. Aksjeinformasjon er gruppert under "aksjer".
      Informasjon om selskapet aksjene tilhører er under "utsteder".
    felt:
      eierskapUUID:               "Unik identifikator for eierskapsforholdet"
      år:                         "Året eierskapet gjelder for"
      aksjonærNavn:               "Navn på aksjonæren slik det er registrert"
      eier.person.uuid:           "Unik identifikator for eierpersonen (tomt hvis eieren er et selskap)"
      eier.person.navn:           "Fullt navn på eierpersonen"
      eier.person.fødselsdato:    "Fødselsdato for eierpersonen"
      eier.person.fødselsår:      "Fødselsår for eierpersonen"
      eier.person.adresse:        "Adresse for eierpersonen"
      eier.person.postkode:       "Postkode for eierpersonen"
      eier.person.poststed:       "Poststed for eierpersonen"
      eier.person.kommuneNr:      "Kommunenummer for eierpersonen"
      eier.person.kommune:        "Kommunenavn for eierpersonen"
      eier.selskap.navn:          "Navn på eierselskapet (tomt hvis eieren er en person)"
      eier.selskap.uuid:          "Unik identifikator for eierselskapet"
      eier.selskap.orgNr:         "Organisasjonsnummer for eierselskapet"
      utsteder.navn:              "Navn på selskapet aksjene tilhører"
      utsteder.uuid:              "Unik identifikator for selskapet"
      utsteder.orgNr:             "Organisasjonsnummer for selskapet"
      aksjer.andel:               "Eierandel i prosent (f.eks. 50.0 betyr 50%)"
      aksjer.antall:              "Antall aksjer denne eieren har"
      aksjer.stemmeandel:         "Stemmeandel i prosent"
      aksjer.stemmeantall:        "Antall stemmeaksjer denne eieren har"
      aksjer.totalAntall:         "Totalt antall aksjer i selskapet"
      aksjer.totalStemmeantall:   "Totalt antall stemmeaksjer i selskapet"

  - navn: "aksjeeiebok"
    beskrivelse: >
      Den offisielle aksjeeierboken per selskap per år.
      Aksjonærens personopplysninger er gruppert under "aksjonær".
      Aksjeinformasjon er gruppert under "aksjer".
    felt:
      orgNr:                  "Organisasjonsnummer for selskapet"
      selskap:                "Navn på selskapet"
      år:                     "Året opplysningene gjelder for"
      aksjeklasse:            "Type aksje (f.eks. A-aksjer eller B-aksjer)"
      aksjonær.navn:          "Navn på aksjonæren"
      aksjonær.fødselsår:     "Fødselsår for personen, eller organisasjonsnummer hvis aksjonæren er et selskap"
      aksjonær.postnr_sted:   "Postnummer og poststed"
      aksjonær.landkode:      "Landkode for aksjonæren"
      aksjer.antall:          "Antall aksjer denne aksjonæren eier"
      aksjer.antallSelskap:   "Totalt antall aksjer i selskapet"

  - navn: "politikere"
    beskrivelse: >
      Oversikt over politikere med valgresultater.
      Personopplysninger er under "personInfo", partitilhørighet under "parti",
      kommunetilknytning under "kommune", og valgresultater under "valg".
    felt:
      personInfo.navn:            "Politikerens fulle navn"
      personInfo.fødselsdato:     "Fødselsdato"
      parti.navn:                 "Partiet politikeren representerer"
      kommune.navn:               "Kommunen politikeren stiller til valg i"
      kommune.nr:                 "Kommunenummer"
      valg.listeplass:            "Plassering på partiets valgliste"
      valg.personstemmer:         "Antall personstemmer politikeren mottok"
      valg.stemmetillegg:         "Antall stemmer lagt til fra sentralt hold"
      valg.slengere:              "Antall velgere fra andre partier som stemte på denne personen"
      valg.endeligRangering:      "Endelig rangering etter valgoppgjør"
      valg.innvalgt:              "Sant eller usant — om politikeren ble valgt inn"