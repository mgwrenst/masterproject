beskrivelse: >
  Teknisk schema for groundtruthStructured. Dette er en strukturert
  dokumentmodell. Fullstendige oppføringer ligger i egne samlinger, mens
  selskap og personer også har innebygde lister med sammendrag for naturlig
  navigasjon.

samlinger:

  - navn: "selskap"
    beskrivelse: "Ett strukturert dokument per selskap."
    felt:
      uuid:
        type: "string|null"
      navn:
        type: "string"
      orgNr:
        type: "integer|string"
      organisasjonstype:
        type: "string|null"
      bransje.naceKode:
        type: "number|string|null"
      bransje.naceBeskrivelse:
        type: "string|null"
      datoer.etablertDato:
        type: "string|date|null"
      datoer.oppløstDato:
        type: "string|date|null"
      status.konkursFlagg:
        type: "integer"
        verdier: [0, 1]
      status.likvidasjonFlagg:
        type: "integer"
        verdier: [0, 1]
      relasjoner.antallRoller:
        type: "integer"
      relasjoner.antallEierskap:
        type: "integer"
      relasjoner.antallAksjeeierbok:
        type: "integer"
      relasjoner.harRoller:
        type: "boolean"
      relasjoner.harEierskap:
        type: "boolean"
      relasjoner.harAksjeeierbok:
        type: "boolean"
      relasjoner.embeddedLimit:
        type: "integer"
      roller:
        type: "array<object>"
        beskrivelse: "Innebygd rolle-sammendrag, avkortet ved store lister."
      roller.rolle:
        type: "string|null"
      roller.rolleRang:
        type: "integer|number|null"
      roller.rolleUUID:
        type: "string|null"
      roller.selskapRolleUUID:
        type: "string|null"
      roller.startdato:
        type: "string|date|null"
      roller.sluttdato:
        type: "string|date|null"
      roller.person.uuid:
        type: "string|null"
      roller.person.navn:
        type: "string|null"
      roller.person.fødselsdato:
        type: "string|date|null"
      roller.person.fødselsår:
        type: "integer|number|null"
      roller.person.kjønn:
        type: "string|null"
      roller.person.politiker.erPolitiker:
        type: "boolean"
      roller.person.politiker.partinavn:
        type: "string|null"
      roller.person.politiker.kommune:
        type: "string|null"
      eierskap:
        type: "array<object>"
        beskrivelse: "Innebygd eierskap-sammendrag, avkortet ved store lister."
      eierskap.uuid:
        type: "string|null"
      eierskap.år:
        type: "integer"
      eierskap.eier.type:
        type: "string|null"
        eksempelverdier: ["person", "selskap"]
      eierskap.eier.aksjonærNavn:
        type: "string|null"
      eierskap.eier.uuid:
        type: "string|null"
      eierskap.eier.navn:
        type: "string|null"
      eierskap.eier.fødselsdato:
        type: "string|date|null"
      eierskap.eier.fødselsår:
        type: "integer|number|null"
      eierskap.eier.orgNr:
        type: "integer|string|null"
      eierskap.eier.politiker.erPolitiker:
        type: "boolean"
      eierskap.eier.politiker.partinavn:
        type: "string|null"
      eierskap.aksjer.andel:
        type: "number|null"
      eierskap.aksjer.antall:
        type: "integer|number|null"
      eierskap.aksjer.totalAntall:
        type: "integer|number|null"
      eierskap.stemmer.andel:
        type: "number|null"
      eierskap.stemmer.antall:
        type: "integer|number|null"
      eierskap.stemmer.totalAntall:
        type: "integer|number|null"
      aksjeeiebok:
        type: "array<object>"
        beskrivelse: "Innebygd aksjeeierbok-sammendrag, avkortet ved store lister."
      aksjeeiebok.år:
        type: "integer"
      aksjeeiebok.aksjeklasse:
        type: "string|null"
      aksjeeiebok.aksjonær.navn:
        type: "string|null"
      aksjeeiebok.aksjonær.fødselsår:
        type: "integer|number|null"
      aksjeeiebok.aksjonær.landkode:
        type: "string|null"
      aksjeeiebok.aksjonær.poststed:
        type: "string|null"
      aksjeeiebok.aksjonær.politiker.erPolitiker:
        type: "boolean"
      aksjeeiebok.aksjonær.politiker.partinavn:
        type: "string|null"
      aksjeeiebok.aksjer.antall:
        type: "integer|number|null"
      aksjeeiebok.aksjer.antallTotaltISelskap:
        type: "integer|number|null"

  - navn: "personer"
    beskrivelse: "Ett dokument per identifisert person eller politiker."
    felt:
      uuid:
        type: "string|null"
      navn:
        type: "string"
      fødselsdato:
        type: "string|date|null"
      fødselsår:
        type: "integer|number|null"
      kjønn:
        type: "string|null"
      politiker.erPolitiker:
        type: "boolean"
      politiker.partinavn:
        type: "string|null"
      politiker.kommune:
        type: "string|null"
      politiker.kommunenummer:
        type: "integer|number|null"
      politiker.innvalgt:
        type: "string|null"
      politiker.valg.listeplass:
        type: "integer|number|null"
      politiker.valg.endeligRangering:
        type: "integer|number|null"
      politiker.valg.personstemmer:
        type: "integer|number|null"
      politiker.valg.slengere:
        type: "integer|number|null"
      politiker.valg.stemmetillegg:
        type: "string|number|null"
      politiker.match.type:
        type: "string|null"
      politiker.match.confidence:
        type: "string|null"
      relasjoner.antallRoller:
        type: "integer"
      relasjoner.antallEierskap:
        type: "integer"
      relasjoner.antallAksjeeierbok:
        type: "integer"
      relasjoner.embeddedLimit:
        type: "integer"
      roller:
        type: "array<object>"
        beskrivelse: "Innebygd rolle-sammendrag, avkortet ved store lister."
      roller.rolle:
        type: "string|null"
      roller.selskap.uuid:
        type: "string|null"
      roller.selskap.orgNr:
        type: "integer|string|null"
      roller.selskap.navn:
        type: "string|null"
      eierskap:
        type: "array<object>"
        beskrivelse: "Innebygd eierskap-sammendrag, avkortet ved store lister."
      eierskap.uuid:
        type: "string|null"
      eierskap.år:
        type: "integer"
      eierskap.selskap.uuid:
        type: "string|null"
      eierskap.selskap.orgNr:
        type: "integer|string|null"
      eierskap.selskap.navn:
        type: "string|null"
      eierskap.aksjer.andel:
        type: "number|null"
      eierskap.aksjer.antall:
        type: "integer|number|null"
      aksjeeiebok:
        type: "array<object>"
        beskrivelse: "Innebygd aksjeeierbok-sammendrag, avkortet ved store lister."
      aksjeeiebok.år:
        type: "integer"
      aksjeeiebok.aksjeklasse:
        type: "string|null"
      aksjeeiebok.selskap.orgNr:
        type: "integer|string|null"
      aksjeeiebok.selskap.navn:
        type: "string|null"
      aksjeeiebok.aksjer.antall:
        type: "integer|number|null"
      aksjeeiebok.aksjer.antallTotaltISelskap:
        type: "integer|number|null"

  - navn: "roller"
    beskrivelse: >
      Fullstendig samling med alle originale rolleoppføringer fra flat personer.
      Bruk denne for fullstendige rollequeryer.
    felt:
      navn:
        type: "string"
      fødselsdato:
        type: "string|date|null"
      fødselsår:
        type: "integer|number|null"
      kjønn:
        type: "string|null"
      adresse:
        type: "string|null"
      kommuneNavn:
        type: "string|null"
      kommuneNr:
        type: "integer|number|string|null"
      postnummer:
        type: "integer|number|string|null"
      poststed:
        type: "string|null"
      land:
        type: "string|null"
      landkode:
        type: "string|null"
      selskapRolle:
        type: "string"
      selskapRolleRang:
        type: "integer|number|null"
      selskapNavn:
        type: "string"
      selskapOrgNr:
        type: "integer|string"
      selskapUUID:
        type: "string|null"
      rolleUUID:
        type: "string|null"
      selskapRolleUUID:
        type: "string|null"
      rolleStartdato:
        type: "string|date|null"
      rolleSluttdato:
        type: "string|date|null"
      rolleRegistrert:
        type: "string|date|null"
      rolleOppdatert:
        type: "string|date|null"
      selskapRegistrert:
        type: "string|date|null"
      selskapOppdatert:
        type: "string|date|null"
      registrertTid:
        type: "string|date|null"
      oppdatertTid:
        type: "string|date|null"

  - navn: "politikere"
    beskrivelse: "Fullstendig samling med alle politikeroppføringer."
    felt:
      navn:
        type: "string"
      fødselsdato:
        type: "string|date|null"
      partinavn:
        type: "string|null"
      kommune:
        type: "string|null"
      kommunenummer:
        type: "integer|number|null"
      innvalgt:
        type: "string|null"
      listeplass:
        type: "integer|number|null"
      personstemmer:
        type: "integer|number|null"
      slengere:
        type: "integer|number|null"
      stemmetillegg:
        type: "string|number|null"
      endelig_rangering:
        type: "integer|number|null"

  - navn: "eierskap"
    beskrivelse: "Fullstendig samling med alle eierskapsoppføringer."
    felt:
      eierskapUUID:
        type: "string|null"
      eierskapår:
        type: "integer"
      eierPersonNavn:
        type: "string|null"
      eierPersonFødselsdato:
        type: "string|date|null"
      eierPersonFødselsår:
        type: "integer|number|null"
      eierPersonKjønn:
        type: "string|null"
      eierPersonAdresse:
        type: "string|null"
      eierPersonKommune:
        type: "string|null"
      eierPersonKommuneNr:
        type: "integer|number|string|null"
      eierPersonPostkode:
        type: "integer|number|string|null"
      eierPersonPoststed:
        type: "string|null"
      eierPersonUUID:
        type: "string|null"
      eierSelskapNavn:
        type: "string|null"
      eierSelskapOrgNr:
        type: "integer|string|null"
      eierSelskapUUID:
        type: "string|null"
      utstederNavn:
        type: "string"
      utstederOrgNr:
        type: "integer|string"
      utstederUUID:
        type: "string|null"
      eierskapAksjonær:
        type: "string|null"
      eierskapAndel:
        type: "number|null"
      eierskapAntall:
        type: "integer|number|null"
      eierskapStemmeandel:
        type: "number|null"
      eierskapStemmeantall:
        type: "integer|number|null"
      eierskapTotalAntall:
        type: "integer|number|null"
      eierskapTotalStemmeantall:
        type: "integer|number|null"

  - navn: "aksjeeiebok"
    beskrivelse: "Fullstendig samling med alle aksjeeierbokoppføringer."
    felt:
      år:
        type: "integer"
      aksjeklasse:
        type: "string|null"
      aksjonærNavn:
        type: "string|null"
      fødselsår:
        type: "integer|number|null"
      landkode:
        type: "string|null"
      postnr/sted:
        type: "string|null"
      selskap:
        type: "string"
      orgNr:
        type: "integer|string"
      antallAksjer:
        type: "integer|number|null"
      antallAksjerSelskap:
        type: "integer|number|null"

regler:
  - "Bruk selskap for spørsmål om selskapsstatus, datoer, bransje eller selskapets egne felter."
  - "Bruk roller for fullstendige spørringer over rolleoppføringer."
  - "Bruk politikere for fullstendige spørringer over politikerdata."
  - "Bruk eierskap for fullstendige spørringer over eierskapsdata."
  - "Bruk aksjeeiebok for fullstendige spørringer over aksjeeierbokdata."
  - "Innebygde lister i selskap og personer er sammendrag og kan være avkortet; ikke bruk dem for fullstendige globale tellinger."
  - "Teknisk bruker kjenner til indekser og bør foretrekke indekserte felter i filter og lookup når det passer spørsmålet."
  - "Indekser i selskap: orgNr, navn, status.konkursFlagg, status.likvidasjonFlagg, bransje.naceBeskrivelse, relasjoner.harRoller, relasjoner.harEierskap, relasjoner.harAksjeeierbok."
  - "Indekser i personer: uuid, navn, politiker.erPolitiker, roller.selskap.orgNr, eierskap.selskap.orgNr."
  - "Indekser i roller: selskapOrgNr, navn, fødselsdato, selskapRolle."
  - "Indekser i politikere: navn, fødselsdato, partinavn, innvalgt."
  - "Indekser i eierskap: utstederOrgNr, eierPersonNavn, eierPersonFødselsdato, eierskapår."
  - "Indekser i aksjeeiebok: orgNr, år, aksjonærNavn, aksjeklasse."
