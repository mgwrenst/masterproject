beskrivelse: >
  Database over norske selskaper, eierskap, roller og politikere.
  Dataene er hentet fra offentlige registre (Brønnøysundregistrene, Enhetsregisteret).

samlinger:

  - navn: "selskap"
    beskrivelse: "Stamdata for registrerte norske selskaper."
    indekser:
      - felt: "uuid"
        type: "unik"
      - felt: "orgNr"
        type: "unik"
      - felt: "konkursFlagg"
        type: "standard"
    felt:
      uuid:
        type: "string"
        påkrevd: true
        beskrivelse: "Primærnøkkel — intern UUID for selskapet"
      navn:
        type: "string"
        påkrevd: true
        beskrivelse: "Registrert selskapsnavn"
      orgNr:
        type: "string"
        påkrevd: true
        beskrivelse: "Organisasjonsnummer (9 siffer)"
      organisasjonstype:
        type: "string"
        eksempelverdier: ["AS", "ASA", "ENK", "ANS", "DA"]
        beskrivelse: "Selskapsform fra Enhetsregisteret"
      etablertDato:
        type: "date"  # TODO: bekreft format — ISO 8601 string eller Date-objekt?
        beskrivelse: "Stiftelsesdato"
      oppløstDato:
        type: "date"  # TODO: bekreft format
        nullable: true
        beskrivelse: "Dato for nedleggelse. Null hvis selskapet er aktivt."
      konkursFlagg:
        type: "integer"
        verdier: [0, 1]
        beskrivelse: "1 = konkurs, 0 = ikke konkurs"
      likvidasjonFlagg:
        type: "integer"
        verdier: [0, 1]
        beskrivelse: "1 = under likvidasjon, 0 = ikke under likvidasjon"
      naceKode:
        type: "string"  # TODO: bekreft format — f.eks. "62.010"
        nullable: true
        beskrivelse: "NACE-bransjekode"

  - navn: "personer"
    beskrivelse: >
      Én rad per person per selskapsrolle. En person med roller i flere selskaper
      vil ha flere rader. Join mot selskap via selskapOrgNr = selskap.orgNr.
    indekser:
      - felt: "UUID"
        type: "standard"
      - felt: "selskapOrgNr"
        type: "standard"
      - felt: "selskapRolle"
        type: "standard"
    felt:
      UUID:
        type: "string"
        påkrevd: true
        beskrivelse: "Intern UUID for personen"
      navn:
        type: "string"
        påkrevd: true
        beskrivelse: "Fullt navn"
      fødselsdato:
        type: "date"  # TODO: bekreft format
        nullable: true
        beskrivelse: "Fødselsdato"
      fødselsår:
        type: "integer"
        nullable: true
        beskrivelse: "Fødselsår — utledet fra fødselsdato"
      kjønnUUID:
        type: "string"
        nullable: true
        beskrivelse: "Referanse til kjønnsoppslag"  # TODO: finnes egen kjønnstabell?
      adresse:
        type: "string"
        nullable: true
        beskrivelse: "Gateadresse"
      postnummer:
        type: "string"
        nullable: true
        beskrivelse: "Postnummer (4 siffer som string)"
      poststed:
        type: "string"
        nullable: true
        beskrivelse: "Poststed"
      kommuneNr:
        type: "string"  # TODO: bekreft — string eller integer?
        nullable: true
        beskrivelse: "Kommunenummer"
      kommuneNavn:
        type: "string"
        nullable: true
        beskrivelse: "Kommunenavn"
      land:
        type: "string"
        nullable: true
        beskrivelse: "Landnavn i klartekst"
      landkode:
        type: "string"
        nullable: true
        beskrivelse: "ISO 3166-1 alpha-2 landkode (f.eks. NO)"
      registrertTid:
        type: "datetime"  # TODO: bekreft format
        beskrivelse: "Tidspunkt for første registrering i databasen"
      oppdatertTid:
        type: "datetime"  # TODO: bekreft format
        beskrivelse: "Tidspunkt for siste oppdatering"
      selskapNavn:
        type: "string"
        beskrivelse: "Navn på tilknyttet selskap (denormalisert)"
      selskapUUID:
        type: "string"
        beskrivelse: "UUID for tilknyttet selskap — referanse til selskap.uuid"
      selskapOrgNr:
        type: "string"
        beskrivelse: "Organisasjonsnummer for tilknyttet selskap — join-nøkkel mot selskap.orgNr"
      selskapRegistrert:
        type: "datetime"  # TODO: bekreft format
        beskrivelse: "Registreringstidspunkt for selskapet"
      selskapOppdatert:
        type: "datetime"  # TODO: bekreft format
        beskrivelse: "Siste oppdateringstidspunkt for selskapet"
      selskapRolle:
        type: "string"
        eksempelverdier: ["Styreleder", "Daglig leder", "Styremedlem", "Varamedlem"]
        beskrivelse: "Rollebetegnelse i selskapet"
      selskapRolleUUID:
        type: "string"
        beskrivelse: "UUID for rolletypen"
      selskapRolleRang:
        type: "integer"  # TODO: bekreft type og rangeringslogikk
        nullable: true
        beskrivelse: "Numerisk rangering av rollen — lavere tall = høyere rang"
      rolleUUID:
        type: "string"
        beskrivelse: "Unik identifikator for denne spesifikke person–selskap–rolle-relasjonen"
      rolleStartdato:
        type: "date"  # TODO: bekreft format
        nullable: true
        beskrivelse: "Startdato for rollen"
      rolleSluttdato:
        type: "date"  # TODO: bekreft format
        nullable: true
        beskrivelse: "Sluttdato for rollen. Null hvis rollen er aktiv."
      rolleRegistrert:
        type: "datetime"  # TODO: bekreft format
        beskrivelse: "Tidspunkt da rollen ble registrert"
      rolleOppdatert:
        type: "datetime"  # TODO: bekreft format
        beskrivelse: "Tidspunkt da rollen sist ble oppdatert"

  - navn: "eierskap"
    beskrivelse: >
      Eierskapsforhold per år. Én rad per eier per selskap per år.
      Eieren kan være en person (eierPersonUUID satt) eller et selskap (eierSelskapUUID satt).
      Join mot selskap via utstederOrgNr = selskap.orgNr.
    indekser:
      - felt: "eierskapUUID"
        type: "unik"
      - felt: "utstederOrgNr"
        type: "standard"
      - felt: "eierskapår"
        type: "standard"
      - felt: "eierPersonUUID"
        type: "standard"
    felt:
      eierskapUUID:
        type: "string"
        påkrevd: true
        beskrivelse: "Primærnøkkel for eierskapsforholdet"
      eierskapår:
        type: "integer"
        påkrevd: true
        beskrivelse: "Året eierskapet gjelder for"
      eierskapAndel:
        type: "float"
        beskrivelse: "Eierandel i prosent (0.0–100.0)"
      eierskapAntall:
        type: "integer"
        beskrivelse: "Antall aksjer eid"
      eierskapAksjonær:
        type: "string"
        beskrivelse: "Aksjonærnavn slik det er registrert i kildedata"
      eierskapStemmeandel:
        type: "float"
        beskrivelse: "Stemmeandel i prosent (0.0–100.0)"
      eierskapStemmeantall:
        type: "integer"
        beskrivelse: "Antall stemmeaksjer eid"
      eierskapTotalAntall:
        type: "integer"
        beskrivelse: "Totalt antall aksjer i selskapet"
      eierskapTotalStemmeantall:
        type: "integer"
        beskrivelse: "Totalt antall stemmeaksjer i selskapet"
      eierPersonUUID:
        type: "string"
        nullable: true
        beskrivelse: "UUID for eierpersonen. Null hvis eieren er et selskap."
      eierPersonNavn:
        type: "string"
        nullable: true
        beskrivelse: "Fullt navn på eierpersonen (denormalisert)"
      eierPersonFødselsdato:
        type: "date"  # TODO: bekreft format
        nullable: true
        beskrivelse: "Fødselsdato for eierpersonen"
      eierPersonFødselsår:
        type: "integer"
        nullable: true
        beskrivelse: "Fødselsår for eierpersonen"
      eierPersonKjønnUUID:
        type: "string"
        nullable: true
        beskrivelse: "Kjønnsreferanse for eierpersonen"
      eierPersonAdresse:
        type: "string"
        nullable: true
        beskrivelse: "Adresse for eierpersonen"
      eierPersonPostkode:
        type: "string"
        nullable: true
        beskrivelse: "Postkode for eierpersonen"
      eierPersonPoststed:
        type: "string"
        nullable: true
        beskrivelse: "Poststed for eierpersonen"
      eierPersonKommuneNr:
        type: "string"  # TODO: bekreft — string eller integer?
        nullable: true
        beskrivelse: "Kommunenummer for eierpersonen"
      eierPersonKommune:
        type: "string"
        nullable: true
        beskrivelse: "Kommunenavn for eierpersonen"
      eierSelskapNavn:
        type: "string"
        nullable: true
        beskrivelse: "Navn på eierselskapet. Null hvis eieren er en person."
      eierSelskapUUID:
        type: "string"
        nullable: true
        beskrivelse: "UUID for eierselskapet"
      eierSelskapOrgNr:
        type: "string"
        nullable: true
        beskrivelse: "Organisasjonsnummer for eierselskapet"
      utstederNavn:
        type: "string"
        beskrivelse: "Navn på selskapet som aksjene tilhører (denormalisert)"
      utstederUUID:
        type: "string"
        beskrivelse: "UUID for utstedende selskap"
      utstederOrgNr:
        type: "string"
        beskrivelse: "Organisasjonsnummer for utstedende selskap — join-nøkkel mot selskap.orgNr"

  - navn: "aksjeeiebok"
    beskrivelse: >
      Offisiell aksjeeierbok per selskap per år, fordelt på aksjeklasse.
      Én rad per aksjonær per aksjeklasse per år.
      Join mot selskap via orgNr = selskap.orgNr.
    indekser:
      - felt: "orgNr"
        type: "standard"
      - felt: "år"
        type: "standard"
    felt:
      orgNr:
        type: "string"
        påkrevd: true
        beskrivelse: "Organisasjonsnummer — join-nøkkel mot selskap.orgNr"
      selskap:
        type: "string"
        beskrivelse: "Selskapsnavn (denormalisert)"
      år:
        type: "integer"
        påkrevd: true
        beskrivelse: "Året opplysningene gjelder for"
      aksjeklasse:
        type: "string"
        eksempelverdier: ["A", "B"]  # TODO: bekreft mulige verdier
        beskrivelse: "Aksjeklasse"
      aksjonærNavn:
        type: "string"
        beskrivelse: "Navn på aksjonæren"
      fødselsår:
        type: "string"  # TODO: bekreft — kan inneholde både årstall og orgnr
        nullable: true
        beskrivelse: "Fødselsår for person, eller organisasjonsnummer hvis aksjonæren er et selskap"
      postnr_sted:
        type: "string"  # TODO: bekreft feltnavn — originalt 'postnr/sted'
        nullable: true
        beskrivelse: "Postnummer og poststed som kombinert streng"
      landkode:
        type: "string"
        nullable: true
        beskrivelse: "ISO 3166-1 alpha-2 landkode"
      antallAksjer:
        type: "integer"
        beskrivelse: "Antall aksjer denne aksjonæren eier"
      antallAksjerSelskap:
        type: "integer"
        beskrivelse: "Totalt antall aksjer i selskapet for denne aksjeklassen"

  - navn: "politikere"
    beskrivelse: >
      Valgdata for politikere på kommunenivå. Én rad per politiker per valg.
    indekser:
      - felt: "kommune_nr"
        type: "standard"
      - felt: "partinavn"
        type: "standard"
      - felt: "innvalgt"
        type: "standard"
    felt:
      navn:
        type: "string"
        påkrevd: true
        beskrivelse: "Politikerens fulle navn"
      partinavn:
        type: "string"
        beskrivelse: "Partinavn"
      kommune_nr:
        type: "string"  # TODO: bekreft — string eller integer?
        beskrivelse: "Kommunenummer"
      kommune:
        type: "string"
        beskrivelse: "Kommunenavn"
      fødselsdato:
        type: "date"  # TODO: bekreft format
        nullable: true
        beskrivelse: "Fødselsdato"
      listeplass:
        type: "integer"
        beskrivelse: "Opprinnelig plassering på partiets valgliste"
      personstemmer:
        type: "integer"
        beskrivelse: "Antall personstemmer mottatt"
      stemmetillegg:
        type: "integer"
        beskrivelse: "Stemmetillegg tildelt fra partiet sentralt"
      slengere:
        type: "integer"
        beskrivelse: "Antall slengere — stemmer fra velgere som krysset over fra andre partier"
      endeligRangering:
        type: "integer"
        beskrivelse: "Endelig rangering etter valgoppgjør"
      innvalgt:
        type: "boolean"
        beskrivelse: "true hvis politikeren ble valgt inn, false hvis ikke"